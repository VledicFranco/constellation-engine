<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <title>Constellation Engine Full Logo (Dark Background)</title>
  <desc>Full logo with icon and wordmark (dark background)</desc>

  <!-- Icon (scaled from 64x64 canonical design) -->
  <g transform="translate(8, 8)">
    <!-- Nodes (4-pointed stars) - scaled to 48x48 -->
    <polygon points="24.75,6.5 27,10.6 32.4,12.4 27,14.2 22.5,14.2 17.1,12.4 22.5,10.6" fill="#a5b4fc"/>
    <polygon points="15.75,20.2 18,24.3 25.2,27.4 18.45,29.6 15.75,34.6 13.05,29.6 6.3,27.4 13.05,25.1" fill="#a5b4fc"/>
    <polygon points="33.75,28.5 32.25,31.7 42,34.9 35.9,36.7 33.75,41.25 31.6,36.7 25.5,34.9 31.6,33.1" fill="#a5b4fc"/>

    <!-- Connections (lines) -->
    <line x1="24.75" y1="12.4" x2="15.75" y2="27.4" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24.75" y1="12.4" x2="33.75" y2="34.9" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">
    Constellation
  </text>
</svg>
