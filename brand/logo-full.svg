<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <title>Constellation Engine Full Logo</title>
  <desc>Full logo with icon and wordmark (light background)</desc>

  <!-- Icon (scaled from 64x64 canonical design: 0.75x = 48x48) -->
  <g transform="translate(8, 8)">
    <!-- Nodes (4-pointed stars) - scaled to 48x48 -->
    <polygon points="24.75,6.5 27,10.6 32.4,12.4 27,14.2 22.5,14.2 17.1,12.4 22.5,10.6" fill="#6366f1"/>
    <polygon points="15.75,20.2 18,24.3 25.2,27.4 18.45,29.6 15.75,34.6 13.05,29.6 6.3,27.4 13.05,25.1" fill="#6366f1"/>
    <polygon points="33.75,28.5 32.25,31.7 42,34.9 35.9,36.7 33.75,41.25 31.6,36.7 25.5,34.9 31.6,33.1" fill="#6366f1"/>

    <!-- Connections (lines) - stroke width scaled 0.75x -->
    <line x1="24.75" y1="12.4" x2="15.75" y2="27.4" stroke="#6366f1" stroke-width="2.7" stroke-linecap="round"/>
    <line x1="24.75" y1="12.4" x2="33.75" y2="34.9" stroke="#6366f1" stroke-width="2.7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#1e293b">
    Constellation
  </text>
</svg>
