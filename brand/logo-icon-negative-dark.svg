<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Dark</title>
  <desc>Inverted constellation logo dark variant: light background with dark purple nodes</desc>

  <!-- Outer circle (light background) -->
  <circle cx="32" cy="32" r="28" fill="#f1f5f9"/>

  <!-- Nodes (4-pointed stars) - rule of 3: top (small) → left (large) ← right (medium), even circle padding -->
  <polygon points="32,7.8 35,13.2 42.2,16 35,18.4 32,23.8 29,18.4 21.8,16 29,13.2" fill="#4338ca"/>
  <polygon points="14,35.4 17.6,42 27.6,44 17.6,46 14,52.6 10.4,46 0.4,44 10.4,42" fill="#4338ca"/>
  <polygon points="50,35.4 53.6,42 63.6,44 53.6,46 50,52.6 46.4,46 36.4,44 46.4,42" fill="#4338ca"/>

  <!-- Connections (dark purple lines) - clean, balanced three-tier structure -->
  <line x1="32" y1="16" x2="14" y2="44" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="50" y2="44" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
</svg>
