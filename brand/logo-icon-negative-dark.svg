<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Dark</title>
  <desc>Inverted constellation logo dark variant: light background with dark purple nodes</desc>

  <!-- Outer circle (light background) -->
  <circle cx="32" cy="32" r="28" fill="#f1f5f9"/>

  <!-- Nodes (4-pointed stars) - rule of 3: top (small) → right (medium) → left (large) -->
  <polygon points="32,13.5 34.5,18 40.5,20 34.5,22 32,26.5 29.5,22 23.5,20 29.5,18" fill="#4338ca"/>
  <polygon points="20,27 23,32.5 30.5,35 23,37.5 20,43 17,37.5 9.5,35 17,32.5" fill="#4338ca"/>
  <polygon points="44,41.2 47,47.5 55.5,50 47,52.5 44,58.8 41,52.5 32.5,50 41,47.5" fill="#4338ca"/>

  <!-- Connections (dark purple lines) - lambda shape: source branches into processing and distribution -->
  <line x1="24" y1="12" x2="32" y2="25" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="25" x2="20" y2="35" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="25" x2="44" y2="50" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
</svg>
