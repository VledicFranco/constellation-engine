<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Dark</title>
  <desc>Inverted constellation logo dark variant: light background with dark purple nodes</desc>

  <!-- Outer circle (light background) -->
  <circle cx="32" cy="32" r="28" fill="#f1f5f9"/>

  <!-- Nodes (4-pointed stars) -->
  <polygon points="32,13.5 34.5,18 40.5,20 34.5,22 32,26.5 29.5,22 23.5,20 29.5,18" fill="#4338ca"/>
  <polygon points="20,33.5 22.5,38 28.5,40 22.5,42 20,46.5 17.5,42 11.5,40 17.5,38" fill="#4338ca"/>
  <polygon points="44,33.5 46.5,38 52.5,40 46.5,42 44,46.5 41.5,42 35.5,40 41.5,38" fill="#4338ca"/>

  <!-- Connections (dark purple lines) -->
  <line x1="32" y1="25" x2="20" y2="35" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="25" x2="44" y2="35" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
</svg>
