<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Dark</title>
  <desc>Inverted constellation logo dark variant: light background with dark purple nodes</desc>

  <!-- Outer circle (light background) -->
  <circle cx="32" cy="32" r="28" fill="#f1f5f9"/>

  <!-- Nodes (4-pointed stars) - rule of 3: top (small) → right (medium) → left (large), scaled 1.2x -->
  <polygon points="32,12.2 35,17.6 42.2,20 35,22.4 32,27.8 29,22.4 21.8,20 29,17.6" fill="#4338ca"/>
  <polygon points="20,30.4 23.6,37 32.6,40 23.6,43 20,49.6 16.4,43 7.4,40 16.4,37" fill="#4338ca"/>
  <polygon points="44,39.4 47.6,47 57.8,50 47.6,53 44,60.6 40.4,53 30.2,50 40.4,47" fill="#4338ca"/>

  <!-- Connections (dark purple lines) - lambda shape: source branches into processing and distribution -->
  <line x1="22" y1="6" x2="32" y2="20" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="20" y2="40" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="44" y2="50" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
</svg>
