<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Dark</title>
  <desc>Inverted constellation logo dark variant: light background with dark purple nodes</desc>

  <!-- Outer circle (light background) -->
  <circle cx="32" cy="32" r="28" fill="#f1f5f9"/>

  <!-- Nodes (4-pointed stars) - rule of 3: top (V-shape, no bottom) → right (0.8x smaller) → left (1.25x) -->
  <polygon points="32,10.2 35,15.6 42.2,18 35,20.4 29,20.4 21.8,18 29,15.6" fill="#4338ca"/>
  <polygon points="20,28.4 23,33.8 32.6,38 23.6,41 20,47.6 16.4,41 7.4,38 16.4,35" fill="#4338ca"/>
  <polygon points="44,39.5 42,43.8 55,48 46.9,50.4 44,56.5 41.1,50.4 33,48 41.1,45.6" fill="#4338ca"/>

  <!-- Connections (dark purple lines) - asymmetric cascade: top to left and right -->
  <line x1="32" y1="18" x2="20" y2="38" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="44" y2="48" stroke="#4338ca" stroke-width="3.6" stroke-linecap="round"/>
</svg>
