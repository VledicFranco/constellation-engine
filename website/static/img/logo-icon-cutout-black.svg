<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Constellation Engine Logo - Negative Cutout Black Gradient</title>
  <desc>Inverted constellation logo: black background with gradient transparent cutout shape</desc>

  <defs>
    <mask id="cutoutMaskBlack">
      <!-- White background = opaque, black shapes = transparent -->
      <circle cx="32" cy="32" r="28" fill="white"/>
      <!-- Black stars (will be transparent in result) -->
      <polygon points="33,8.7 36,14.1 43.2,16.5 36,18.9 30,18.9 22.8,16.5 30,14.1" fill="black"/>
      <polygon points="21,26.9 24,32.3 33.6,36.5 24.6,39.5 21,46.1 17.4,39.5 8.4,36.5 17.4,33.5" fill="black"/>
      <polygon points="45,38 43,42.3 56,46.5 47.9,48.9 45,55 42.1,48.9 34,46.5 42.1,44.1" fill="black"/>
      <!-- Black lines (will be transparent in result) -->
      <line x1="33" y1="16.5" x2="21" y2="36.5" stroke="black" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="33" y1="16.5" x2="45" y2="46.5" stroke="black" stroke-width="3.6" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Black circle with cutout shape mask -->
  <circle cx="32" cy="32" r="28" fill="#000000" mask="url(#cutoutMaskBlack)"/>
</svg>
