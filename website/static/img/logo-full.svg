<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <title>Constellation Engine Full Logo - Gradient</title>
  <desc>Full logo with icon and wordmark (light background) with indigo gradient</desc>

  <defs>
    <linearGradient id="fullLogoGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon (scaled from 64x64 canonical design: 0.75x = 48x48) -->
  <g transform="translate(8, 8)">
    <!-- Connections (lines) - drawn first, stars on top -->
    <line x1="24.75" y1="12.4" x2="15.75" y2="27.4" stroke="url(#fullLogoGradient)" stroke-width="2.7" stroke-linecap="round"/>
    <line x1="24.75" y1="12.4" x2="33.75" y2="34.9" stroke="url(#fullLogoGradient)" stroke-width="2.7" stroke-linecap="round"/>

    <!-- Nodes (4-pointed stars) - drawn last to be on top -->
    <polygon points="24.75,6.5 27,10.6 32.4,12.4 27,14.2 22.5,14.2 17.1,12.4 22.5,10.6" fill="url(#fullLogoGradient)"/>
    <polygon points="15.75,20.2 18,24.3 25.2,27.4 18.45,29.6 15.75,34.6 13.05,29.6 6.3,27.4 13.05,25.1" fill="url(#fullLogoGradient)"/>
    <polygon points="33.75,28.5 32.25,31.7 42,34.9 35.9,36.7 33.75,41.25 31.6,36.7 25.5,34.9 31.6,33.1" fill="url(#fullLogoGradient)"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#1e293b">
    Constellation
  </text>
</svg>
